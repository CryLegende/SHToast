name: SHToast
version: '${project.version}'
main: org.Cry_Legende.sHToast.SHToast
api-version: '1.20'
author: Cry_Legende
depend: [UltimateAdvancementAPI]

commands:
  shtoast:
    description: Sends a toast notification
    usage: /<command> <block> <type> <player|global> <message>

permissions:
  shtoast.use:
    description: Allows user to send toasts with /shtoast command
    default: op
